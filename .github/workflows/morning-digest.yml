# ============================================================================
#  Morning digest — P0 wall 6 (2026-06-10): "approve over coffee"
# ============================================================================
#
#  ONE email across ALL active tenants: each business's pending moves,
#  what shipped/verified in the last day, and a link to approve.
#
#  Schedule: 14:00 UTC (~7 AM PT) — after the night's full chain
#  (scan 04:00 → generation 05:30 → poll 07:00) so the queue in the
#  email is the fresh one.
#
#  Delivery gating (explicit operator opt-in — a missing key is a SKIP,
#  not a failure):
#    RESEND_API_KEY   (secret)  — WAITING FOR OPERATOR (resend.com).
#    BEACON_DIGEST_TO (variable) — operator inbox.
#    BEACON_DIGEST_FROM (variable, optional) — verified sender; the
#      Resend onboarding sender is used when unset (delivers only to
#      the Resend account owner — fine for the single-operator digest).
#
#  Read-only except the email. No paid AI calls. Failure alert mirrors
#  the other nightly jobs (deduped GitHub issue).
# ============================================================================

name: Morning digest

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: morning-digest
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  digest:
    name: Compose + send the morning digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run morning digest
        run: |
          npx tsx --require ./scripts/mock-server-only.cjs scripts/run-morning-digest.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_SOURCE: supabase
          DUAL_WRITE: "true"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BEACON_DIGEST_TO: ${{ vars.BEACON_DIGEST_TO }}
          BEACON_DIGEST_FROM: ${{ vars.BEACON_DIGEST_FROM }}
          BEACON_APP_URL: ${{ vars.BEACON_APP_URL }}
          # P0 wall 5 — the cross-business page-shape insight strip
          # ("1" enables; repo var so it flips without a commit).
          BEACON_CROSS_TENANT_BRAIN: ${{ vars.BEACON_CROSS_TENANT_BRAIN }}
          NODE_NO_WARNINGS: "1"

  alert-on-failure:
    name: Alert on failure
    needs: [digest]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "🔴 Morning digest is failing";
            const body = [
              "The morning-digest workflow failed (a configured send errored —",
              "missing keys only SKIP, they don't fail).",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["ops", "automation"],
              });
            }
