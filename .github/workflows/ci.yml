name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # 2026-05-26: build gate so CI catches Next build / route breaks before
      # Vercel does (CI previously stopped at typecheck+test). Tenant env
      # mirrors the verified-local build incantation (non-secret slugs); the
      # build is env-light — only /rank is statically prerendered and it has no
      # data/Supabase deps. NOTE: unverifiable without a push — the first CI run
      # after this lands is its maiden execution; watch that run.
      - name: Build
        run: npm run build
        env:
          BEACON_TENANT_ID: tenant-ritz-founder
          BEACON_TENANT_SLUG: ritz-founder
