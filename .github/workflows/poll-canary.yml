# ============================================================================
#  Poll canary — silent-failure alerting for the native-poll cron
# ============================================================================
#
#  Why this workflow exists (read this before editing):
#
#  On 2026-04-23 the daily native-poll cron at 10:00 UTC succeeded for
#  Perplexity but silently failed for ChatGPT (all 4 chunks returned HTTP 200
#  with `status: "failed"` JSON bodies because OPENAI_API_KEY was missing
#  from Vercel env). The main `daily-native-poll.yml` workflow was marked
#  GREEN in GitHub because `curl --fail-with-body` didn't trip on an
#  application-level failure, and nobody noticed for hours.
#
#  This workflow fixes that blind spot:
#
#    - Fires at 07:45 UTC, 45 min after the main poll cron at 07:00 UTC.
#      Perplexity runs take ~10 min; ChatGPT ~11 min. By 07:45 UTC both
#      jobs must be terminal. (Shifted 2026-04-24 alongside the main cron
#      from 10:45 UTC → 07:45 UTC to avoid GitHub Actions peak-hour delay.)
#    - Runs `scripts/check-yesterday-poll.ts`, which queries Supabase for
#      today's observation_runs and exits non-zero if any platform isn't
#      "ok" (4/4 chunks completed).
#    - Non-zero exit fails the workflow. GitHub's default
#      "email on failed workflow" sends Armeen an email within minutes.
#      Re-enable at Settings → Notifications → Actions if turned off.
#
#  Multi-tenant scaffold (2026-05-06):
#
#  This canary is **single-tenant by documented design** today. Two reasons:
#
#    1. `scripts/check-yesterday-poll.ts` is currently TENANT-AGNOSTIC — it
#       queries `observation_runs` for the day across all tenants without a
#       `--tenant` filter. With Ritz as the only enabled tenant, the canary
#       effectively covers Ritz. When a second tenant is enabled in
#       ops/active-tenants.json, this script needs a `--tenant` flag and
#       this workflow needs to expand into a matrix per tenant — otherwise
#       a single failing tenant would conflate with healthy ones in the
#       same canary report. Tracked in NEXT_PHASE_EXECUTION_PLAN.md.
#
#    2. `scripts/canary-persistence-write.ts` writes a synthetic
#       observation row through the dual-write pipeline and cleans it up.
#       It needs a single concrete tenant_id. Today this is sourced from
#       the first enabled tenant in ops/active-tenants.json (Ritz) via the
#       compute-matrix job below; mirrors the pattern in daily-native-poll.yml.
#
#  Required repo secrets (same as main poll workflow):
#    NEXT_PUBLIC_SUPABASE_URL
#    SUPABASE_SERVICE_ROLE_KEY
#
#  Manual fire for testing:
#    Actions → "Poll canary" → Run workflow
#
#  Forced-fail smoke test (do once after first deploy):
#    Temporarily rename one of today's observation_runs rows in Supabase so
#    the canary sees < 4 chunks for that platform, run workflow manually,
#    confirm email arrives, revert the rename.
# ============================================================================

name: Poll canary

on:
  schedule:
    # ── 2026-05-10 redundant-schedule reliability fix ─────────────────────────
    # Mirrors the daily-native-poll backup cadence (07:00 / 08:30 / 10:00 UTC):
    # each canary fires ~45 min after its corresponding poll attempt so a
    # late-firing poll still gets verified. Each canary read is read-only
    # (queries observation_runs + prompt_answer_observations); running it
    # multiple times per day costs nothing and is idempotent.
    #
    # The canary will report ✓ ok as soon as ANY of the day's poll attempts
    # has landed cleanly — so even if only the primary or only a backup
    # fires, downstream alerting stays accurate.
    - cron: "45 7 * * *"    # primary canary     07:45 UTC
    - cron: "15 9 * * *"    # backup canary 1    09:15 UTC
    - cron: "45 10 * * *"   # backup canary 2    10:45 UTC
  workflow_dispatch:

concurrency:
  group: poll-canary
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Compute the per-tenant matrix from ops/active-tenants.json. Same shape
  # and fail-loud rules as the daily-native-poll.yml compute-matrix job.
  # The canary itself is currently single-tenant (see file-top notes), but
  # this step still validates the config so the canary fails loud if Ritz
  # is missing or the JSON is malformed — symmetric with the main poll cron.
  # --------------------------------------------------------------------------
  compute-matrix:
    name: Compute active-tenants matrix
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      first_tenant_id: ${{ steps.compute.outputs.first_tenant_id }}
      first_tenant_slug: ${{ steps.compute.outputs.first_tenant_slug }}
      tenant_count: ${{ steps.compute.outputs.tenant_count }}
    steps:
      - uses: actions/checkout@v4
      - id: compute
        run: |
          set -euo pipefail
          CONFIG=ops/active-tenants.json
          if [ ! -f "$CONFIG" ]; then
            echo "::error file=$CONFIG::ops/active-tenants.json is missing — refusing to run canary"
            exit 1
          fi
          MATRIX=$(jq -c '[.[] | select(.enabled == true)]' "$CONFIG")
          COUNT=$(echo "$MATRIX" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error file=$CONFIG::No tenants with enabled=true — refusing to run canary"
            exit 1
          fi
          RITZ_OK=$(echo "$MATRIX" | jq '[.[] | select(.tenantId == "tenant-ritz-founder")] | length')
          if [ "$RITZ_OK" -eq 0 ]; then
            echo "::error file=$CONFIG::Ritz (tenant-ritz-founder) is missing or disabled — refusing to run canary without Ritz"
            exit 1
          fi
          # Single-tenant by documented design today: pick the first
          # enabled tenant for the persistence-write canary.
          FIRST_TID=$(echo "$MATRIX" | jq -r '.[0].tenantId')
          FIRST_SLUG=$(echo "$MATRIX" | jq -r '.[0].slug')
          {
            echo "first_tenant_id=$FIRST_TID"
            echo "first_tenant_slug=$FIRST_SLUG"
            echo "tenant_count=$COUNT"
          } >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 1 ]; then
            echo "::warning::More than one tenant is enabled ($COUNT). Today's canary is single-tenant by design; revisit scripts/check-yesterday-poll.ts and this workflow before relying on it for multi-tenant coverage."
          fi

  canary:
    name: Check today's poll health (${{ needs.compute-matrix.outputs.first_tenant_slug }})
    needs: compute-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run poll-health canary
        # Tenant-agnostic today: inspects observation_runs for the day
        # across all tenants. Adequate while only Ritz is active.
        run: npx tsx --require ./scripts/mock-server-only.cjs scripts/check-yesterday-poll.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Poll Integrity Hardening (2026-05-04, post May 2-4 incident).
      # Operator R5 contract — verify the FULL persistence pipeline
      # works end-to-end via a mock-provider write/read/cleanup cycle.
      # Catches silent column drift BEFORE it can swallow paid polling.
      # No paid API calls; ZERO marginal cost.
      - name: Run persistence-write canary (${{ needs.compute-matrix.outputs.first_tenant_slug }})
        run: npx tsx --require ./scripts/mock-server-only.cjs scripts/canary-persistence-write.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DUAL_WRITE: "true"
          # Tenant identity sourced from ops/active-tenants.json (first
          # enabled). Was hardcoded `tenant-ritz-founder` pre-2026-05-06.
          BEACON_TENANT_ID: ${{ needs.compute-matrix.outputs.first_tenant_id }}
