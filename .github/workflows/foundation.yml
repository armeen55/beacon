name: foundation

# The bloat firewall, on demand only. The full gate (guard + typecheck + tests +
# build) runs locally before every push, so running it again on every push spent
# Actions minutes re-proving the same SHA. Trigger manually from the Actions tab
# when an independent check is wanted. See foundation-budget.json.

on:
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Foundation budget guard (LOC / routes / domains / files / deps)
        run: npm run guard:foundation
      - name: Typecheck
        run: npm run typecheck
      - name: Retained behavioral tests
        run: npm run test
      - name: Build
        run: npm run build
