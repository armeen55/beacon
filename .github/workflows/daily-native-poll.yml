# ============================================================================
#  Daily native AI-visibility poll (Hobby-safe orchestrator)
# ============================================================================
#
#  Why this workflow exists (read this before editing):
#
#  Our hosted /api/poll/run endpoint on Vercel is capped at 300s (Hobby plan).
#  A full 100-prompt poll per platform takes ~685s locally, so we chunk each
#  platform into 4 calls of 25 prompts. That means we need 8 trigger events
#  per day (4 chunks × 2 platforms) PER ACTIVE TENANT.
#
#  Vercel Hobby cron supports up to 100 entries but each cron fires only
#  once/day with hourly (±59 min) timing precision. Running 8 chunks via 8
#  separate Hobby crons works technically but produces unreliable timing +
#  fragmented observability. GitHub Actions gives us precise scheduling, one
#  file of config, native retry via the Actions UI, and failure emails.
#
#  Multi-tenant scaffold (Gap A, 2026-05-07) — read this before adding tenants:
#
#  Active-tenants list is read by `scripts/list-active-tenants.ts`. That script
#  PREFERS the Supabase `tenants` table (status='active'), and FALLS BACK to
#  `ops/active-tenants.json` when Supabase env vars aren't set or the query
#  fails. The compute-matrix job calls the script and gets back an array of
#  `{ tenantId, slug, siteDomain, enabled: true }` rows, one matrix entry
#  per active tenant.
#
#  Why DB-preferred: once self-serve onboarding ships, customers signing up
#  insert a row into the Supabase `tenants` table with status='active'. The
#  next 07:00 UTC cron picks them up automatically — no git commit, no
#  workflow edit. Today the table has exactly one entry (Ritz), matching
#  the JSON file byte-for-byte.
#
#  Why JSON fallback: transitional safety. CI can run without the Supabase
#  env vars wired (the JSON file ships with the repo). When the lister can't
#  reach Supabase, it logs a WARN and uses the JSON. The fallback lets us
#  evolve the DB path without breaking the cron mid-migration.
#
#  Fail-loud guards in compute-matrix:
#    1. ops/active-tenants.json must exist and be valid JSON.
#    2. At least one tenant must be enabled.
#    3. Ritz (tenant-ritz-founder) must be present AND enabled.
#       Hard guard against accidental disable that would silently
#       skip Customer 1's daily reading. Cron emails on failure.
#
#  We burn ~960 GitHub Actions minutes/month per active tenant (well under
#  the 2,000 free for one tenant; comfortable for 2). Escape hatch if we
#  ever want to move back onto Vercel cron: Pro upgrade gives us unlimited
#  minute-precise cron entries; this YAML maps to a vercel.json cron block
#  in ~10 lines per tenant.
#
#  Chunk semantics + idempotency:
#
#  - Each chunk call writes its own observation_run tagged with
#    `chunk offset=N limit=25` in scope_label.
#  - runNativePoll dedupes same-chunk retries within a 15-min window
#    (Phase 5 Step 1.6). Accidental GitHub re-runs within that window are
#    absorbed silently via status "skipped_chunk_recently_ran".
#  - Snapshot derivation is cumulative-per-UTC-day; out-of-order or
#    partial-day completion still produces correct daily_metric_snapshots.
#
#  Required repo secrets (Settings → Secrets and variables → Actions):
#    NEXT_PUBLIC_SUPABASE_URL    (poll + verify-persistence)
#    SUPABASE_SERVICE_ROLE_KEY   (poll + verify-persistence)
#    PERPLEXITY_API_KEY          (Perplexity poll)
#    OPENAI_API_KEY              (ChatGPT poll)
#    BEACON_URL                  (manual /api/poll/run fallback only — kept for ops)
#    CRON_SECRET                 (manual /api/poll/run fallback only — kept for ops)
#
#  Ops workflow:
#    - Scheduled daily at 07:00 UTC (~12 AM PT summer / 11 PM PT prev-day winter)
#    - Failures → GitHub emails you; also visible in the Actions tab
#    - Manual fire: Actions → "Daily native AI-visibility poll" → Run workflow
#
#  Schedule history:
#    - 2026-04-24: shifted from `0 10 * * *` to `0 7 * * *`. 10:00 UTC was
#      routinely delivered 5–7 hours late by GitHub Actions during European
#      workday-start peak load (observation_runs.started_at for Apr 23 +
#      Apr 24 both far past the scheduled mark). 07:00 UTC is off-peak and
#      typically fires within 10 min. See docs/VERIFICATION_LOG.md 2026-04-24
#      Phase 5.5 entry.
#    - 2026-05-06: refactored from hardcoded tenant-ritz-founder to a
#      matrix-from-JSON shape sourced from ops/active-tenants.json. Ritz
#      remains the only enabled tenant. See VERIFICATION_LOG.md 2026-05-06
#      "multi-tenant cron scaffold" entry.
# ============================================================================

name: Daily native AI-visibility poll

on:
  schedule:
    # ── 2026-05-10 redundant-schedule reliability fix ─────────────────────────
    # GitHub Actions' shared scheduler can silently skip a scheduled workflow
    # entirely (we've seen this multiple times during peak-load windows on
    # private repos). Three scheduled attempts per UTC day instead of one
    # dramatically reduces the chance Beacon goes a full day without fresh
    # AI-visibility data.
    #
    # Why redundant schedules don't double-spend:
    #   • runNativePoll's UTC-day budget guard (defaultHasRecentRun) checks
    #     `observation_runs` for a `status='completed'` row on the current
    #     UTC date BEFORE calling the provider adapter. The first scheduled
    #     attempt that actually fires writes that row; every subsequent
    #     same-day attempt returns `skipped_already_ran_today` → no adapter
    #     call → no API spend → no DB writes.
    #   • Test coverage: src/domains/observations/run-poll.test.ts ("budget
    #     guard: skips the run when a same-UTC-day completed run exists")
    #     pins `expect(adapterSpy).not.toHaveBeenCalled()` so the no-spend
    #     property is ratcheted.
    #   • Per-run cost ceiling (BEACON_PER_RUN_BUDGET_USD, default $8) is
    #     also in force as a backstop.
    #
    # Schedule choices (UTC) — primary first, then 90-minute spacing so the
    # GH scheduler has room to land the primary before backups race:
    - cron: "0 7 * * *"     # primary    07:00 UTC
    # ── 2026-05-26 Actions-minute conservation ──────────────────────────────
    # Backups disabled to stop scheduled-run minute burn ahead of the Actions
    # quota reset. They never double-SPEND (the UTC-day budget guard above
    # makes same-day repeats no-op), but they DO burn checkout+install+preflight
    # minutes each day. Re-enable by uncommenting if GH-scheduler skips recur;
    # meanwhile use workflow_dispatch to re-fire a missed day.
    # - cron: "30 8 * * *"    # backup 1   08:30 UTC
    # - cron: "0 10 * * *"    # backup 2   10:00 UTC
  # Manual trigger from the Actions tab. Use this to verify the flow once
  # after first deploy, then let the schedule take over.
  workflow_dispatch:

# Prevent overlapping runs (e.g. if a previous day's workflow is still going
# when the next daily schedule fires). Cancel the older run.
concurrency:
  group: daily-native-poll
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Compute the per-tenant matrix from ops/active-tenants.json.
  #
  # Fail-loud rules (any of these aborts the workflow before any paid call):
  #   - ops/active-tenants.json missing or unparseable.
  #   - Zero tenants with enabled === true.
  #   - Ritz (tenant-ritz-founder) missing or disabled.
  #
  # Matrix shape consumed by downstream jobs:
  #   tenants = [{ tenantId, slug, siteDomain, enabled, ... }, ...]
  # Only the `tenantId` field is used by the poll curl bodies today; the
  # rest are passed through for future use (per-tenant rebuild / scan).
  # --------------------------------------------------------------------------
  compute-matrix:
    name: Compute active-tenants matrix
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tenants: ${{ steps.compute.outputs.tenants }}
      tenant_count: ${{ steps.compute.outputs.tenant_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      # Gap A (2026-05-07) — read active tenants via the lister script
      # (DB-preferred, JSON-fallback) instead of parsing the static
      # ops/active-tenants.json file directly. Unblocks self-serve sign-up:
      # once a customer's tenant row in Supabase is set to status='active',
      # the next 07:00 UTC cron picks them up automatically — no git
      # commit, no workflow edit needed.
      #
      # Fallback chain (same script, same output shape):
      #   1. Supabase tenants table where status='active'  (preferred)
      #   2. ops/active-tenants.json (kept as safety net + CI without DB env)
      #
      # The lister exits non-zero with a structured ::error if both
      # sources fail — the workflow stays fail-loud as before.
      - id: compute
        run: |
          set -euo pipefail
          MATRIX=$(npx tsx --require ./scripts/mock-server-only.cjs scripts/list-active-tenants.ts)
          COUNT=$(echo "$MATRIX" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No active tenants — refusing to run cron with empty matrix"
            exit 1
          fi
          # Hard guard: Ritz (tenant-ritz-founder) must be present AND
          # active. Prevents accidental Customer-1 disable from silently
          # skipping the dogfeed reading. Same guard as pre-Gap-A; just
          # checked against the lister's output instead of the JSON file.
          RITZ_OK=$(echo "$MATRIX" | jq '[.[] | select(.tenantId == "tenant-ritz-founder")] | length')
          if [ "$RITZ_OK" -eq 0 ]; then
            echo "::error::Ritz (tenant-ritz-founder) is missing or disabled — refusing to run cron without Ritz"
            exit 1
          fi
          {
            echo "tenants=$MATRIX"
            echo "tenant_count=$COUNT"
          } >> "$GITHUB_OUTPUT"
          echo "Active tenants: $COUNT"
          echo "$MATRIX" | jq
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # --------------------------------------------------------------------------
  # Perplexity — full 100-prompt run on the GitHub runner.
  #
  # Bundle 2 (2026-05-07) — replaced the chunked-curl-to-Vercel approach
  # with a direct CLI call to runNativePoll on the runner. Eliminates the
  # 300s Vercel maxDuration cap (which today timed out 4 chunks × 4
  # platforms because of abnormally-slow upstream Perplexity latency).
  # The Vercel /api/poll/run route still exists as a manual/debug
  # fallback — both code paths converge at runNativePoll, so persistence
  # semantics, raw_poll_chunks safety net, persistence-gate guard, and
  # dual-write are byte-identical between the two paths.
  #
  # Single-call shape: no chunking. runNativePoll handles the full 100
  # prompts in one observation_run. GitHub-hosted runners have 6h job
  # wall time and 30m default per workflow — comfortable headroom even
  # at slow upstream rates (today's recovery took 26 min).
  #
  # Runs once per active tenant in parallel (matrix).
  # --------------------------------------------------------------------------
  poll-perplexity:
    name: Poll Perplexity · ${{ matrix.tenant.slug }}
    needs: compute-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 30 was tight at slow upstream; +15 min margin
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJSON(needs.compute-matrix.outputs.tenants) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Perplexity poll · ${{ matrix.tenant.slug }}
        run: npm run cron:poll -- --tenant=${{ matrix.tenant.tenantId }} --platform=perplexity
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          DUAL_WRITE: "true"
          DATA_SOURCE: supabase
          BEACON_TENANT_ID: ${{ matrix.tenant.tenantId }}
          # 2026-05-10 budget-ledger Stage B.2 wiring fix. The
          # shadow-mode dual-write writer in run-poll.ts checks
          # `process.env.BEACON_BUDGET_LEDGER_DUAL_WRITE === "1"`
          # at runtime; without this line the GH-runner env was
          # `undefined` and the writer silently no-op'd even though
          # the GH repo secret was set. Stage B.2 verifier was
          # `failed` on 2026-05-10 polls until this landed.
          BEACON_BUDGET_LEDGER_DUAL_WRITE: ${{ secrets.BEACON_BUDGET_LEDGER_DUAL_WRITE }}

  # --------------------------------------------------------------------------
  # ChatGPT (OpenAI) — full 100-prompt run on the GitHub runner.
  # Same architecture as poll-perplexity above. Runs in parallel.
  # --------------------------------------------------------------------------
  poll-openai:
    name: Poll ChatGPT · ${{ matrix.tenant.slug }}
    needs: compute-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJSON(needs.compute-matrix.outputs.tenants) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run ChatGPT poll · ${{ matrix.tenant.slug }}
        run: npm run cron:poll -- --tenant=${{ matrix.tenant.tenantId }} --platform=openai
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DUAL_WRITE: "true"
          DATA_SOURCE: supabase
          BEACON_TENANT_ID: ${{ matrix.tenant.tenantId }}
          # 2026-05-10 budget-ledger Stage B.2 wiring fix. See the
          # matching note on the Perplexity step above — without this
          # line the dual-write writer silently no-op'd on the runner.
          BEACON_BUDGET_LEDGER_DUAL_WRITE: ${{ secrets.BEACON_BUDGET_LEDGER_DUAL_WRITE }}

  # --------------------------------------------------------------------------
  # Phase v4 Commit 7B (2026-04-30) — Rebuild citation_evidence_index from
  # native observations after both polls complete. /pages, /competitors,
  # /topics read this index; without this step they keep showing the
  # 2026-04-15-frozen Profound import. The endpoint reads observations from
  # Supabase, builds the index in-process, and upserts id='current'. Idempotent
  # — running multiple times on the same data converges to the same state.
  # `if: always()` so a partial poll still refreshes whatever native data we
  # got that day rather than staying stale because one chunk timed out.
  #
  # Multi-tenant scaffold (2026-05-06): the rebuild endpoint is currently
  # TENANT-AGNOSTIC — it reads ALL native observations across all tenants
  # and writes a single global row at `citation_evidence_index.id='current'`.
  # Therefore this job stays a singleton (one invocation per workflow run,
  # NOT a matrix). When/if the index becomes per-tenant, convert this job
  # to a matrix-driven shape mirroring the poll jobs above. Tracked in
  # NEXT_PHASE_EXECUTION_PLAN.md.
  # --------------------------------------------------------------------------
  rebuild-citation-evidence-index:
    name: Rebuild citation_evidence_index (native, global)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [compute-matrix, poll-perplexity, poll-openai]
    if: always() && needs.compute-matrix.result == 'success'
    steps:
      - name: Trigger rebuild
        run: |
          curl -sS -X POST "$BEACON_URL/api/cron/rebuild-citation-evidence-index" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 90 --fail-with-body
        env:
          BEACON_URL: ${{ secrets.BEACON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  # --------------------------------------------------------------------------
  # Poll Integrity Hardening (2026-05-04, post May 2-4 incident) — verify
  # that persistence actually happened today.
  #
  # Why this job exists: between May 1 and May 4, daily polls cost ~$9 in
  # API spend but persisted ZERO observations because `dual-write` silently
  # swallowed PGRST204 column-drift errors. The workflow stayed green and
  # nobody noticed for three days.
  #
  # Operator R4 contract: the scheduled workflow must exit non-zero if:
  #   • expected prompts > 0 and persisted observations = 0
  #   • snapshots failed to derive
  #   • raw chunk save failed
  #   • Supabase write failed
  #
  # Implementation: re-runs `check-yesterday-poll.ts` (the same canary
  # script that runs at 07:45 UTC) inline at the end of the daily poll.
  # The canary now reads from `prompt_answer_observations` and downgrades
  # any "ok"-with-zero-persisted to "failed" (Bug-1 cross-check). When
  # the canary exits non-zero, this job fails RED and the operator gets
  # GitHub's failure email within minutes — not 45 min later via the
  # separate canary workflow.
  #
  # Multi-tenant scaffold (2026-05-06): `check-yesterday-poll.ts` does not
  # currently filter by tenant — it inspects all tenants' observation_runs
  # for the day. With Ritz as the only active tenant today, behavior is
  # unchanged. When a 2nd tenant is enabled, the script needs a `--tenant`
  # flag and this job becomes a matrix; tracked in
  # NEXT_PHASE_EXECUTION_PLAN.md.
  #
  # `if: always()` so partial chunk failures don't skip the verify step.
  # The verify step itself decides whether the day landed enough data.
  # --------------------------------------------------------------------------
  verify-persistence:
    name: Verify persistence (Operator R4 contract)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [compute-matrix, poll-perplexity, poll-openai, rebuild-citation-evidence-index]
    if: always() && needs.compute-matrix.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify today's polls actually persisted to Supabase
        run: npx tsx --require ./scripts/mock-server-only.cjs scripts/check-yesterday-poll.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
