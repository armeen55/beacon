# ============================================================================
#  Daily scheduled scan — Recommendation Lifecycle OS Phase 5 (2026-04-28)
# ============================================================================
#
#  Why this workflow exists (read this before editing):
#
#  The scan path (`runWebsiteScan` → spawns `scripts/scan-owned-pages.ts` CLI
#  → writes to `.data/tenants/{slug}/...` → dual-writes to Supabase →
#  triggers Phase 3 lifecycle runner) requires:
#    - Writable filesystem for the CLI subprocess (.data/...)
#    - tsx (devDependency) available to spawn the CLI
#    - npm install access to install the toolchain
#
#  Vercel's serverless lambda has read-only FS outside /tmp and may not have
#  tsx in the production image. So scheduled scans CANNOT run on Vercel cron
#  with the current architecture (same constraint that put the native poll
#  on GH Actions per .github/workflows/daily-native-poll.yml).
#
#  GH Actions ubuntu-latest runner has full FS + can `npm install` + has tsx.
#  The runner's local `.data` writes are ephemeral (job FS wiped at exit) but
#  the orchestrator dual-writes everything that needs to persist to Supabase.
#  Verified end-to-end by Steps 1–5 of the safety gate (2026-04-28).
#
#  Multi-tenant fleet (2026-05-06, DB-driven 2026-06-10 — P0 wall 2):
#
#  The compute-matrix job calls scripts/list-active-tenants.ts — the SAME
#  lister the daily poll uses: Supabase `tenants` where status='active'
#  (preferred), ops/active-tenants.json as fallback. Activating a tenant
#  row in Supabase adds it to the next 04:00 UTC scan with no git commit.
#  Tenant identity (BEACON_TENANT_ID, BEACON_TENANT_SLUG,
#  BEACON_SITE_DOMAIN) is sourced from the matrix entry; per-tenant ops
#  overrides (scanMaxPages → BEACON_SCAN_MAX_PAGES crawl ceiling) ride
#  the matrix from ops/active-tenants.json. Secrets are still consulted
#  for the LIFECYCLE / SCAN_DISABLED gating flags.
#
#  Fail-loud guards in compute-matrix:
#    1. The lister must return ≥1 active tenant (it exits non-zero itself
#       when both sources fail).
#    2. The required tenant (repo var BEACON_REQUIRED_TENANT_ID, default
#       tenant-ritz-founder) must be present AND active — guard against
#       an accidental status flip silently dropping the anchor customer.
#
#  Schedule: 04:00 UTC daily — runs ~3 hours BEFORE the native poll cron
#  (07:00 UTC, see daily-native-poll.yml). This ordering ensures fresh
#  inventory + lifecycle status are stamped before the poll captures the
#  day's observations.
#
#  Required repo secrets (Settings → Secrets and variables → Actions):
#    NEXT_PUBLIC_SUPABASE_URL         Supabase project URL
#    SUPABASE_SERVICE_ROLE_KEY        Supabase service-role key (write)
#
#  Optional repo secrets (lifecycle / pause gating):
#    BEACON_LIFECYCLE_ENABLED         "1" enables Phase 3 runner inside scan
#    BEACON_LIFECYCLE_VERDICT_ENABLED "1" enables Phase 4 live_at attribution
#    BEACON_SCAN_DISABLED             truthy = pause scheduled scan
#                                     ("1"/"true"/"yes"/"on" case-insensitive)
#
#  No longer required (sourced from ops/active-tenants.json since 2026-05-06):
#    BEACON_TENANT_ID, BEACON_TENANT_SLUG, BEACON_SITE_DOMAIN
#
#  Ops workflow:
#    - Scheduled daily at 04:00 UTC (~9 PM PT prev-day / 8 PM PT prev-day winter)
#    - Failures → GitHub emails the repo owners + visible in the Actions tab
#    - Manual fire: Actions → "Daily scheduled scan" → Run workflow
#    - Pause: set BEACON_SCAN_DISABLED=1 in repo secrets — script exits 0 with
#      structured warn line so the workflow is "successful" but no-op
#
#  Failure handling:
#    See docs/SCAN_FAILURE_ALARM_RULES.md for what to do when this workflow
#    fails (or its sibling poll-canary surfaces stale-poll signals).
# ============================================================================

name: Daily scheduled scan

on:
  schedule:
    # 04:00 UTC = ~9 PM PT (PDT) / ~8 PM PT prev-day (PST). Off-peak on
    # GitHub Actions and 3 hours before the 07:00 UTC native poll, so
    # fresh inventory + lifecycle stamps land before the poll captures
    # the day's observations.
    - cron: "0 4 * * *"
  # Manual trigger from the Actions tab — use after first deploy to verify
  # end-to-end before relying on the schedule.
  #
  # North-star onboarding (2026-06-11): optional `only_tenant` scopes a
  # dispatch to ONE tenant (the launch-time first-scan path). Absent →
  # full fleet matrix, byte-identical to the scheduled run.
  workflow_dispatch:
    inputs:
      only_tenant:
        description: "Scan ONLY this tenantId (launch-time first scan). Empty = full fleet."
        required: false
        type: string

# Prevent overlap if a previous day's scan is still running when the next
# scheduled fire arrives. Cancel the older run; the orchestrator's stale-
# scan-state guard would also recover this on the next manual trigger.
# 2026-06-11: a tenant-scoped dispatch gets its OWN concurrency group so a
# launch-time first scan can NEVER cancel the nightly fleet run mid-flight
# (cancel-in-progress on the shared group made that a real hazard). The
# scheduled path + fleet-wide manual dispatches keep the EXACT historical
# group string — behavior byte-identical when only_tenant is absent.
concurrency:
  group: ${{ inputs.only_tenant && format('scan-tenant-{0}', inputs.only_tenant) || 'daily-scheduled-scan' }}
  cancel-in-progress: true

# Night-shift hardening (2026-06-11): issues:write for the failure
# alert job below — yesterday's scan failure (transient sitemap 415)
# was invisible because this workflow had NO alert path.
permissions:
  contents: read
  issues: write

jobs:
  # --------------------------------------------------------------------------
  # Compute the per-tenant matrix via scripts/list-active-tenants.ts —
  # DB-preferred (Supabase tenants where status='active'), JSON-fallback
  # (ops/active-tenants.json). Same lister + fail-loud rules as
  # daily-native-poll.yml's compute-matrix (Gap A). P0 wall 2 (2026-06-10):
  # a tenant activated in Supabase is scanned the next 04:00 UTC with no
  # git commit. Per-tenant ops overrides (scanMaxPages) ride the matrix.
  # --------------------------------------------------------------------------
  compute-matrix:
    name: Compute active-tenants matrix
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tenants: ${{ steps.compute.outputs.tenants }}
      tenant_count: ${{ steps.compute.outputs.tenant_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: compute
        run: |
          set -euo pipefail
          MATRIX=$(npx tsx --require ./scripts/mock-server-only.cjs scripts/list-active-tenants.ts)
          # 2026-06-11: tenant-scoped dispatch (launch-time first scan).
          # Filter the lister output to the requested tenant; the
          # required-tenant guard below only applies to FLEET runs (a
          # single-tenant run is not a fleet run — requiring Ritz in it
          # would block every other tenant's first scan).
          if [ -n "${ONLY_TENANT:-}" ]; then
            MATRIX=$(echo "$MATRIX" | jq --arg only "$ONLY_TENANT" '[.[] | select(.tenantId == $only)]')
          fi
          COUNT=$(echo "$MATRIX" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No active tenants matched — refusing to run scan with empty matrix"
            exit 1
          fi
          # Required-tenant guard: protects the anchor customer from an
          # accidental DB status flip silently dropping their daily scan.
          # Configurable via repo variable BEACON_REQUIRED_TENANT_ID;
          # defaults to Customer 1 (Ritz). Skipped for tenant-scoped runs.
          if [ -z "${ONLY_TENANT:-}" ]; then
            REQUIRED_OK=$(echo "$MATRIX" | jq --arg id "$REQUIRED_TENANT_ID" '[.[] | select(.tenantId == $id)] | length')
            if [ "$REQUIRED_OK" -eq 0 ]; then
              echo "::error::Required tenant ($REQUIRED_TENANT_ID) is missing or inactive — refusing to run scan without it"
              exit 1
            fi
          fi
          {
            echo "tenants=$MATRIX"
            echo "tenant_count=$COUNT"
          } >> "$GITHUB_OUTPUT"
          echo "Active tenants: $COUNT"
          echo "$MATRIX" | jq
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUIRED_TENANT_ID: ${{ vars.BEACON_REQUIRED_TENANT_ID || 'tenant-ritz-founder' }}
          ONLY_TENANT: ${{ inputs.only_tenant }}

  scheduled-scan:
    name: Scan · ${{ matrix.tenant.slug }}
    needs: compute-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Ritz ~30s; encyclopedia-scale tenants up to ~15 min at the capped serial fetch rate
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJSON(needs.compute-matrix.outputs.tenants) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run scheduled scan (${{ matrix.tenant.slug }})
        # `--require ./scripts/mock-server-only.cjs` so server-only modules
        # imported by orchestrate-scan don't crash in the CLI context (same
        # pattern as `npm run data:scan` per package.json).
        run: |
          npx tsx --require ./scripts/mock-server-only.cjs --require ./scripts/apply-scan-site-domain.cjs scripts/run-scheduled-scan.ts
        env:
          # Tenant identity — sourced from the lister (Supabase-preferred) via matrix.
          BEACON_TENANT_ID: ${{ matrix.tenant.tenantId }}
          BEACON_TENANT_SLUG: ${{ matrix.tenant.slug }}
          BEACON_SITE_DOMAIN: ${{ matrix.tenant.siteDomain }}
          # Per-tenant crawl ceiling (ops override; empty → script default cap).
          BEACON_SCAN_MAX_PAGES: ${{ matrix.tenant.scanMaxPages || '' }}
          # Per-tenant business configs (repo VARIABLE, not secret — names,
          # domains, url patterns; no credentials). Without it the runner
          # has no .data files and every tenant resolves the neutral
          # placeholder config (P0 wall 3 fix, 2026-06-10).
          BEACON_BUSINESS_CONFIG_JSON_BY_TENANT: ${{ vars.BEACON_BUSINESS_CONFIG_JSON_BY_TENANT }}
          # Credentials + dual-write — repo secrets.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_SOURCE: supabase
          DUAL_WRITE: "true"
          # Phase 6D (2026-04-28) — environment-aware scan source label.
          # Hardcoded here (NOT a secret) so every hosted scan run writes
          # `observation_runs.source = "github-actions-daily-scan"` and
          # `last-scan-result.source = "github-actions-daily-scan"`,
          # making hosted runs unambiguously distinguishable from local
          # CLI runs which leave the env unset and fall back to the
          # historical "scan-owned-pages.ts" literal.
          BEACON_SCAN_SOURCE_LABEL: "github-actions-daily-scan"
          # Optional gating flags — operator may leave unset until lifecycle is dogfeded.
          BEACON_LIFECYCLE_ENABLED: ${{ secrets.BEACON_LIFECYCLE_ENABLED }}
          BEACON_LIFECYCLE_VERDICT_ENABLED: ${{ secrets.BEACON_LIFECYCLE_VERDICT_ENABLED }}
          BEACON_SCAN_DISABLED: ${{ secrets.BEACON_SCAN_DISABLED }}
          # Standard CI hygiene
          NODE_NO_WARNINGS: "1"
          NODE_TLS_REJECT_UNAUTHORIZED: "0"

  # Night-shift hardening (2026-06-11): the scan was the ONLY nightly
  # job without a failure alert — the 2026-06-10 failure went unseen.
  # Mirrors the poll/generation alert: deduped GitHub issue.
  alert-on-failure:
    name: Alert on failure
    needs: [compute-matrix, scheduled-scan]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = "🔴 Daily scheduled scan is failing";
            const body = [
              "The daily-scan workflow failed for at least one tenant.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Without a successful scan, tonight's generation runs on stale",
              "page snapshots. Re-running the workflow is safe (idempotent).",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["ops", "automation"],
              });
            }
